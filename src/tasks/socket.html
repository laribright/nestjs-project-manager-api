<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Live task demo</title>
  <h1>Live task notifications</h1>
  <input
    id="token"
    type="password"
    placeholder="Access token without Bearer"
    autocomplete="off"
  />
  <button id="connect">Connect</button>
  <pre id="output">Waiting...</pre>
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    let socket;
    const output = document.getElementById('output');
    const log = (message) => (output.textContent += '\n' + message);
    document.getElementById('connect').onclick = () => {
      if (socket) socket.disconnect();
      output.textContent = 'Connecting...';
      socket = io('http://localhost:3000', {
        transports: ['websocket'],
        auth: { token: document.getElementById('token').value.trim() },
        reconnection: false,
      });
      socket.on('ready', ({ userId }) => log('Ready for account ' + userId));
      socket.on('task.created', (data) => log('New task: ' + data.taskId));
      socket.on('auth_error', log);
      socket.on('connect_error', (error) => log(error.message));
      socket.on('disconnect', () => log('Disconnected'));
    };
  </script>
</html>
